# bootc-image-builder config for generating a bootable install ISO from the
# built RevolutionOS OCI image. Adapted from ublue-os/image-template's
# disk_config/iso-gnome.toml (same pattern used for Bazzite/Aurora/Bluefin's
# own ISOs).
#
# No [customizations.installer.kickstart] here deliberately - this used to
# run `bootc switch --mutate-in-place --transport registry
# ghcr.io/easyocr/revolutionos:latest` in %post, but that image isn't
# actually published (confirmed 403 on ghcr.io 2026-10-14), which would brick
# every install partway through. Omitting it falls back to
# bootc-image-builder's default self-contained installer: the OCI image is
# embedded in the ISO and installed offline, no registry pull needed. Revisit
# once ghcr.io/easyocr/revolutionos is actually being published.

[customizations.installer.modules]
enable = [
"org.fedoraproject.Anaconda.Modules.Storage",
"org.fedoraproject.Anaconda.Modules.Runtime"
]

disable = [
"org.fedoraproject.Anaconda.Modules.Network",
"org.fedoraproject.Anaconda.Modules.Security",
"org.fedoraproject.Anaconda.Modules.Services",
"org.fedoraproject.Anaconda.Modules.Users",
"org.fedoraproject.Anaconda.Modules.Subscription",
"org.fedoraproject.Anaconda.Modules.Timezone"
]
